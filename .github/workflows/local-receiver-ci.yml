name: Local Receiver CI

on:
  pull_request:
    paths:
      - "local-receiver/**"
      - ".github/workflows/local-receiver-ci.yml"
  push:
    branches: [main]
    paths:
      - "local-receiver/**"
      - ".github/workflows/local-receiver-ci.yml"

permissions:
  contents: read

jobs:
  test-local-receiver:
    name: Test local receiver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local-receiver/requirements.txt -r local-receiver/requirements-dev.txt

      - name: Run tests
        working-directory: local-receiver
        run: pytest -q
